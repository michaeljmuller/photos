services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./photos:/photos
      - ./data:/data
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles:
      - test

networks:
  internal:
